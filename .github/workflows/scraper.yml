name: Market Fiyat Güncelleme

on:
  schedule:
    # Her 6 saatte bir (saat başı yoğunluğunu önlemek için :17'de)
    - cron: '17 */6 * * *'
  workflow_dispatch:  # Manuel çalıştırma
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: market-scraper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Python Kurulumu
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Bağımlılıkları Yükle
      run: pip install -r requirements.txt

    # Gerçek veri gelmezse betik hata koduyla çıkar: iş kırmızı görünür,
    # products_data.json değişmez, commit/yayın yapılmaz.
    - name: Fiyatları Çek
      id: scrape
      run: python scraper.py

    - name: Özet
      run: |
        echo "Karşılaştırmalı ürün: ${{ steps.scrape.outputs.count }}"
        echo "Fiyat değişti mi: ${{ steps.scrape.outputs.changed }}"
        echo "### Market fiyatları: ${{ steps.scrape.outputs.count }} ürün, değişiklik: ${{ steps.scrape.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"

    # Yalnızca fiyatlar değiştiyse commit (sadece zaman damgası için commit yok)
    - name: Git Commit
      if: steps.scrape.outputs.changed == 'true'
      run: |
        git config user.name "Safe Scraper Bot"
        git config user.email "bot@safescraper.com"
        git add products_data.json
        git commit -m "Fiyat güncellemesi - $(TZ=Europe/Istanbul date +'%Y-%m-%d %H:%M') (${{ steps.scrape.outputs.count }} ürün)"
        git push

    - name: GitHub Pages Deploy
      if: github.ref == 'refs/heads/main' && (steps.scrape.outputs.changed == 'true' || github.event_name != 'schedule')
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        publish_branch: gh-pages
        exclude_assets: '.github,scraper.log'
