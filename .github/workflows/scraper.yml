name: Market Fiyat Güncelleme

on:
  schedule:
    # Her 6 saatte bir (saat başı yoğunluğunu önlemek için :17'de)
    - cron: '17 */6 * * *'
  workflow_dispatch:  # Manuel çalıştırma
  push:
    branches: [ main ]
  pull_request:  # PR'larda: veri çekilebiliyor mu ve JSON şeması sağlam mı (commit/yayın yok)

permissions:
  contents: write

concurrency:
  group: market-scraper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Python Kurulumu
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Bağımlılıkları Yükle
      run: pip install -r requirements.txt

    # Gerçek veri gelmezse betik hata koduyla çıkar: iş kırmızı görünür,
    # products_data.json değişmez, commit/yayın yapılmaz.
    - name: Fiyatları Çek
      id: scrape
      run: python scraper.py

    - name: Özet
      run: |
        echo "Karşılaştırmalı ürün: ${{ steps.scrape.outputs.count }}"
        echo "Fiyat değişti mi: ${{ steps.scrape.outputs.changed }}"
        echo "### Market fiyatları: ${{ steps.scrape.outputs.count }} ürün, değişiklik: ${{ steps.scrape.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"

    - name: Veri Şeması Kontrolü
      run: |
        python - <<'PY'
        import json
        d = json.load(open("products_data.json", encoding="utf-8"))
        for key in ("source", "last_updated", "markets", "products"):
            assert key in d, f"eksik alan: {key}"
        assert d["products"], "ürün listesi boş"
        discounted = 0
        for p in d["products"]:
            assert p["name"] and p["category"], p
            assert len(p["prices"]) >= 2, f"tek fiyatlı ürün: {p['name']}"
            for x in p["prices"]:
                for key in ("market", "price", "regular_price", "discount", "discount_ratio", "store", "source_time"):
                    assert key in x, f"eksik fiyat alanı {key}: {p['name']}"
                assert 0 < x["price"] <= x["regular_price"], f"fiyat/normal fiyat hatalı: {p['name']} {x['market']}"
                assert x["discount"] == (x["regular_price"] > x["price"]), f"indirim bayrağı tutarsız: {p['name']} {x['market']}"
                discounted += x["discount"]
            # Varsayılan karşılaştırma normal (indirimsiz) fiyata göre
            regular = [x["regular_price"] for x in p["prices"]]
            assert regular == sorted(regular), f"normal fiyat sırası hatalı: {p['name']}"
            assert p["cheapest_price"] == regular[0], f"en ucuz fiyat tutarsız: {p['name']}"
            assert p["best_deal_price"] == min(x["price"] for x in p["prices"]), f"indirimli en ucuz tutarsız: {p['name']}"
        print(f"JSON şeması sağlam: {len(d['products'])} ürün, {len(d['markets'])} market, {discounted} indirimli fiyat")
        PY

    # Yalnızca fiyatlar değiştiyse commit (sadece zaman damgası için commit yok); PR'larda asla
    - name: Git Commit
      if: steps.scrape.outputs.changed == 'true' && github.event_name != 'pull_request'
      run: |
        git config user.name "Safe Scraper Bot"
        git config user.email "bot@safescraper.com"
        git add products_data.json
        git commit -m "Fiyat güncellemesi - $(TZ=Europe/Istanbul date +'%Y-%m-%d %H:%M') (${{ steps.scrape.outputs.count }} ürün)"
        git push

    - name: GitHub Pages Deploy
      if: github.ref == 'refs/heads/main' && (steps.scrape.outputs.changed == 'true' || github.event_name != 'schedule')
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        publish_branch: gh-pages
        exclude_assets: '.github,scraper.log'
